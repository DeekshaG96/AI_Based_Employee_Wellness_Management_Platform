services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodmentor}
      POSTGRES_USER: ${POSTGRES_USER:-moodmentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - moodmentor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodmentor} -d ${POSTGRES_DB:-moodmentor}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://moodmentor:change-this-local-password@db:5432/moodmentor}
      MODEL_NAME: ${MODEL_NAME:-bhadresh-savani/bert-base-go-emotion}
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
      HF_HOME: /var/cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - moodmentor-model-cache:/var/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  moodmentor-postgres:
  moodmentor-model-cache:
