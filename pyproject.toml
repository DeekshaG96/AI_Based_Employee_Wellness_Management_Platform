[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-wellness-platform"
version = "0.1.0"
description = "Employee wellness authentication, ingestion, and sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nltk>=3.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ui = ["streamlit>=1.38", "pandas>=2.0"]


[project.scripts]
wellness-analyze = "wellness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
