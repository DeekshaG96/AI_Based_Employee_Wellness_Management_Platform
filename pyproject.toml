[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-wellness-platform"
version = "0.2.0"
description = "MoodMentor: Employee wellness authentication, ingestion, VADER sentiment, and transformer emotion telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "pydantic>=2.8,<3",
    "nltk>=3.8.1",
    "spacy>=3.7",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.38.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27",
]
ml = [
    "transformers>=4.38,<5",
    "torch>=2.0.0",
]

[project.scripts]
wellness-analyze = "wellness.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["wellness*", "wellness_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110"]
