[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-wellness-platform"
version = "0.2.0"
description = "MoodMentor: Employee wellness authentication, ingestion, VADER sentiment, and transformer emotion telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8.1",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
ml = [
    "transformers>=4.38.0",
    "torch>=2.0.0",
]

[project.scripts]
wellness-analyze = "wellness.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["wellness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
